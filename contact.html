<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Sam Termaat" />
    <meta
      name="description"
      content="Contact the Explore NL student website and send a message using the simple contact form."
    />
    <meta
      name="keywords"
      content="Netherlands, Amsterdam, Rotterdam, Utrecht, travel"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact - Explore the Netherlands</title>

    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <nav>
        <h2>Explore NL</h2>

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="places.html">Places</a></li>
          <li><a href="culture.html">Culture</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-title">
        <h1>Contact</h1>

        <p>Send me a message if you want more information.</p>
      </section>

      <section class="contact-section">
        <article>
          <h2>Send a message</h2>

          <p>
            <em>Fill in the form below.</em>
          </p>

          <form action="#" method="post">
            <fieldset>
              <legend>Contact form</legend>

              <label for="name">Name:</label>
              <input type="text" id="name" name="name" />

              <label for="email">Email:</label>
              <input type="email" id="email" name="email" />

              <label for="message">Message:</label>
              <textarea id="message" name="message"></textarea>

              <input type="submit" value="Send" />
            </fieldset>
          </form>
        </article>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Explore NL &reg; &trade;</p>

      <p>
        Arts &amp; Culture in the Netherlands. Prices can be shown in &euro; or
        &pound;.
      </p>
    </footer>
  </body>
</html>
